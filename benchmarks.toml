pins = {}
model = "LiquidAI/d1-2B-GGUF@4a181094d1b6addfaa3a0956f78e7ab2aa406a0c"
expect = "ok"
note = "llama.cpp b12110 Vulkan0, 25/25 layers offloaded; oha 20 requests, concurrency 1"

